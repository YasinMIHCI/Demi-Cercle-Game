# Crous ou Prison : télécharge les photos candidates depuis Wikimedia Commons
# (depuis les serveurs de GitHub) et les renvoie sur la branche de travail, dans
# tools/crousprison/candidates/ (dossier temporaire, à trier puis à supprimer :
# il ne doit pas arriver dans main).
# Se lance quand tools/crousprison/run.txt est modifié sur une branche claude/**.
name: Photos Crous ou Prison
on:
  push:
    branches: ['claude/**']
    paths: ['tools/crousprison/run.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - name: Télécharger
        run: |
          W=$RUNNER_TEMP/w
          CAP=200 python3 -I tools/crousprison/fetch.py $W prison "Category:Prison cells/2" "Category:Prison cells in France/1"
          CAP=200 python3 -I tools/crousprison/fetch.py $W crous "Category:Student bedrooms/1" "Category:Dormitory rooms/1" "Category:Student housing in France/2"
          python3 tools/crousprison/shrink.py $W tools/crousprison/candidates
      - name: Renvoyer sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/crousprison/candidates
          git commit -m "Crous ou Prison : photos candidates (temporaire)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
